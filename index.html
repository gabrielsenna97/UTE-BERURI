<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grupo Geradores UTE Maués</title>

<style>

:root{
    --preto:#111111;
    --verde:#00843D;
    --amarelo:#FFD100;
    --vermelho:#d00000;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:
    linear-gradient(135deg,#222,#555);

    padding:20px;

    overflow-x:auto;

}



.container{

    width:1200px;

    margin:auto;

    background:#fff;

    padding:30px;

    border:4px solid var(--preto);

    border-radius:15px;

    box-shadow:0 10px 30px #0008;

}



.faixa{

    background:
    linear-gradient(
    90deg,
    var(--preto),
    var(--verde),
    var(--amarelo)
    );

    color:white;

    text-align:center;

    padding:8px;

    font-weight:bold;

    border-radius:5px;

    margin-bottom:20px;

}



.topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:5px solid var(--amarelo);

    padding-bottom:20px;

    margin-bottom:25px;

}



.logo{

    font-size:32px;

    font-weight:900;

    color:var(--verde);

}



.logo small{

    display:block;

    font-size:13px;

    color:#333;

}



h1{

    flex:1;

    text-align:center;

    color:var(--preto);

}



.grid-superior{

    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:15px;

}



.inferior{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:40px;

}



.coluna,
.coluna-inferior{

    display:flex;

    flex-direction:column;

    gap:12px;

}



.bloco{

    height:75px;

    border:3px solid var(--preto);

    border-radius:8px;

    background:
    linear-gradient(145deg,#fff,#e5e5e5);

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    cursor:pointer;

    transition:.2s;

}


.bloco:hover{

    transform:scale(1.05);

    background:#fff3b0;

}



.grande{

    height:180px;

}



.codigo{

    font-size:13px;

    font-weight:bold;

}



.numero{

    font-size:38px;

    font-weight:900;

    color:var(--verde);

}



.centro{

    width:450px;

    margin:30px auto;

    padding:25px;

    text-align:center;

    border:4px solid var(--verde);

    border-radius:12px;

    background:#fffbea;

}


.centro h2{

    color:var(--verde);

}


.centro p{

    font-weight:bold;

    margin:8px;

}



/* ==========================
   JANELA DE OCORRÊNCIA
========================== */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:#0008;

justify-content:center;

align-items:center;

z-index:999;

}



.modal-conteudo{

background:white;

width:450px;

padding:25px;

border-radius:15px;

border:4px solid var(--verde);

}



.modal-conteudo h2{

text-align:center;

color:var(--verde);

margin-bottom:20px;

}



.botao{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:8px;

font-weight:bold;

cursor:pointer;

font-size:16px;

}



.registrar{

background:var(--verde);

color:white;

}



.historico{

background:#333;

color:white;

}



.fechar{

background:#d00000;

color:white;

}



input,textarea{

width:100%;

padding:10px;

margin-top:8px;

border:2px solid #aaa;

border-radius:8px;

}



textarea{

height:120px;

}



</style>

</head>


<body>


<div class="container">


<div class="faixa">
OLIVEIRA ENERGIA - UTE MAUÉS
</div>


<div class="topo">

<div class="logo">
Oliveira Energia
<small>Desde 1972</small>
</div>


<h1>
GRUPO GERADORES<br>
UTE MAUÉS
</h1>

</div>


<div id="superior" class="grid-superior"></div>


<div class="centro">

<h2>60 GRUPOS GERADORES</h2>

<p>360 = 1 GG</p>
<p>550 = 50 GG</p>
<p>625 = 3 GG</p>
<p>KTA = 6 KUMMIS</p>

</div>


<div id="inferior" class="inferior"></div>


</div>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-conteudo" id="modalConteudo">

</div>
   <script>


// ===============================
// CRIAÇÃO DOS BLOCOS
// ===============================


function bloco(c,n,g=false){

return `

<div class="bloco ${g?'grande':''}" onclick="abrirUGD('${n}')">

<div class="codigo">${c}</div>

<div class="numero">${n}</div>

</div>

`;

}



// ===============================
// PARTE SUPERIOR
// ===============================


const superior=[

[
["550-0583","54"],
["550-0715","53"],
["550-0038R","52"],
["625-0017","51"],
["550-0321R","46"],
["550-0517","41"]
],

[
["1808201","55",1],
["550-0297R","50"],
["550-0104R","45"],
["625-0038","40"]
],

[
["1808203","56",1],
["625-0019","49"],
["550-0609R","44"],
["550-0025R","39"]
],

[
["1808198","57",1],
["550-0515","48"],
["550-0518","43"],
["550-0582","38"]
],

[
["1808199","58",1],
["550-0602","47"],
["550-0515","42"],
["550-0251R","37"]
],

[
["1808205","59",1],
["1808200","60",1]
]

];



superior.forEach(col=>{


let h="<div class='coluna'>";


col.forEach(g=>{


h+=bloco(g[0],g[1],g[2]);


});


h+="</div>";


document.querySelector("#superior").innerHTML+=h;


});




// ===============================
// PARTE INFERIOR
// ===============================


const inferior=[


[
["550-0589","04"],
["550-0590","08"],
["550-0598","12"],
["550-0471","16"],
["550-0599","20"],
["550-0600","24"],
["550-0594","28"],
["550-0344R","32"],
["550-0596","36"]
],



[
["550-0562","03"],
["550-0142","07"],
["550-0591","11"],
["550-0476","15"],
["550-0592","19"],
["550-0581","23"],
["550-0366","27"],
["550-0367","31"],
["550-0563","35"]
],



[
["550-0028R","02"],
["550-0597","06"],
["550-0176","10"],
["550-0027R","14"],
["550-0305","18"],
["550-05125R","22"],
["360-0015","26"],
["550-0302R","30"],
["550-0209R","34"]
],



[
["550-0024R","01"],
["550-0184","05"],
["550-0565","09"],
["550-0566","13"],
["550-0601","17"],
["550-0593","21"],
["550-0302R1","25"],
["550-0241R","29"],
["550-0482","33"]
]


];




inferior.forEach(col=>{


let h="<div class='coluna-inferior'>";


col.forEach(g=>{


h+=bloco(g[0],g[1]);


});


h+="</div>";


document.querySelector("#inferior").innerHTML+=h;


});




// ===============================
// VARIÁVEL DA UGD SELECIONADA
// ===============================


let ugdSelecionada="";



// ===============================
// ABRIR MENU DA UGD
// ===============================


function abrirUGD(numero){


ugdSelecionada=numero;



document.getElementById("modal").style.display="flex";



document.getElementById("modalConteudo").innerHTML=`

<h2>
UGD-${numero}
</h2>



<button class="botao registrar"
onclick="registrarOcorrencia()">

📝 Registrar Ocorrência

</button>



<button class="botao historico"
onclick="verHistorico()">

📋 Ver Histórico

</button>



<button class="botao fechar"
onclick="fecharModal()">

Fechar

</button>


`;

}



// ===============================
// BANCO DE DADOS LOCAL
// ===============================


let ocorrencias = JSON.parse(
const API =
"https://script.google.com/macros/s/AKfycbxS3H4OIXRNieWyHZUP5s9yyXIDp9vpVQerZURePcGPBwaZBREUF9V1R1O2YzcxfoZS/exec";)
) || [];




// ===============================
// FORMULÁRIO DE REGISTRO
// ===============================


function registrarOcorrencia(){


let data = new Date()
.toLocaleDateString("pt-BR");



document.getElementById("modalConteudo").innerHTML = `


<h2>
Registrar Ocorrência<br>
UGD-${ugdSelecionada}
</h2>



<label>
Data
</label>

<input 
id="dataOcorrencia"
value="${data}">



<label>
Colaborador
</label>

<input
id="nomeColaborador"
placeholder="Digite o nome">



<label>
Descrição da ocorrência
</label>

<textarea
id="descricaoOcorrencia"
placeholder="Descreva a ocorrência encontrada">
</textarea>




<button class="botao registrar"
onclick="salvarOcorrencia()">

💾 Salvar Ocorrência

</button>




<button class="botao fechar"
onclick="fecharModal()">

Cancelar

</button>


`;

}



// ===============================
// SALVAR REGISTRO
// ===============================


function salvarOcorrencia(){


let data =
document.getElementById("dataOcorrencia").value;



let nome =
document.getElementById("nomeColaborador").value;



let descricao =
document.getElementById("descricaoOcorrencia").value;



if(nome=="" || descricao==""){


alert("Preencha todos os campos");


return;


}




let registro={


ugd:ugdSelecionada,

data:data,

nome:nome,

descricao:descricao


};




ocorrencias.push(registro);




localStorage.setItem(

"ocorrencias_ugd",

JSON.stringify(ocorrencias)

);



alert("Ocorrência registrada!");



fecharModal();



}



// ===============================
// HISTÓRICO DA UGD
// ===============================


function verHistorico(){



let lista =
ocorrencias.filter(
item=>item.ugd==ugdSelecionada
);



let tela=`


<h2>
Histórico UGD-${ugdSelecionada}
</h2>


`;



if(lista.length==0){


tela+=`

<p>
Nenhuma ocorrência registrada.
</p>

`;


}

else{


lista.reverse().forEach(item=>{


tela+=`

<div style="
border:2px solid #ccc;
border-radius:8px;
padding:10px;
margin:10px 0;
">


<b>Data:</b> ${item.data}

<br>


<b>Colaborador:</b> ${item.nome}

<br><br>


<b>Descrição:</b>

<p>

${item.descricao}

</p>


</div>


`;



});


}



tela+=`

<button class="botao fechar"
onclick="fecharModal()">

Fechar

</button>

`;



document.getElementById("modalConteudo").innerHTML=tela;



}




// ===============================
// FECHAR MODAL
// ===============================


function fecharModal(){


document.getElementById("modal").style.display="none";


}





// Fechar clicando fora


window.onclick=function(event){


let modal =
document.getElementById("modal");


if(event.target==modal){


modal.style.display="none";


}


}


</script>


</body>

</html> 

</div>
