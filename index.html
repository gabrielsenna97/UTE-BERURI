<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grupo Geradores UTE Maués</title>

<style>

:root{
    --preto:#111;
    --verde:#00843D;
    --amarelo:#FFD100;
    --cinza:#eeeeee;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:
    linear-gradient(135deg,#222,#555);

    padding:25px;

}



.container{

    max-width:1200px;

    margin:auto;

    background:white;

    padding:30px;

    border-radius:15px;

    border:4px solid var(--preto);

    box-shadow:0 10px 30px #0008;

}



/* CABEÇALHO */

.faixa{

    background:

    linear-gradient(
    90deg,
    var(--preto),
    var(--verde),
    var(--amarelo)
    );

    color:white;

    text-align:center;

    padding:8px;

    font-weight:bold;

    border-radius:6px;

    margin-bottom:20px;

}



.topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:5px solid var(--amarelo);

    padding-bottom:20px;

    margin-bottom:25px;

}



.logo{

    font-size:30px;

    font-weight:900;

    color:var(--verde);

}


.logo small{

    display:block;

    font-size:13px;

    color:#333;

}



h1{

    flex:1;

    text-align:center;

    font-size:30px;

    color:var(--preto);

}



/* MAPA */

.grid-superior{

    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:15px;

}


.inferior{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:40px;

}


.coluna,
.coluna-inferior{

    display:flex;

    flex-direction:column;

    gap:12px;

}



/* GERADORES */

.bloco{

    min-height:75px;

    border:3px solid var(--preto);

    border-radius:8px;

    background:

    linear-gradient(
    145deg,
    #fff,
    var(--cinza)
    );

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    transition:.2s;

}



.bloco:hover{

    border-color:var(--verde);

    box-shadow:0 0 15px var(--verde);

    transform:scale(1.03);

}



.grande{

    height:180px;

}



.codigo{

    font-size:13px;

    font-weight:bold;

    color:#444;

}



.numero{

    font-size:38px;

    font-weight:900;

    color:var(--verde);

}



/* CENTRO */


.centro{

    width:450px;

    margin:30px auto;

    padding:25px;

    text-align:center;

    border:4px solid var(--verde);

    border-radius:12px;

    background:#fffbea;

}


.centro h2{

    color:var(--verde);

    margin-bottom:15px;

}


.centro p{

    font-weight:bold;

    margin:8px;

}



/* MOBILE */

@media(max-width:900px){

.grid-superior{

grid-template-columns:repeat(2,1fr);

}


.inferior{

grid-template-columns:repeat(2,1fr);

}


.centro{

width:100%;

}

}


@media(max-width:500px){

.grid-superior,
.inferior{

grid-template-columns:1fr;

}


.topo{

flex-direction:column;

gap:15px;

}


h1{

font-size:22px;

}

}

</style>

</head>


<body>


<div class="container">


<div class="faixa">
OLIVEIRA ENERGIA - SISTEMA DE GERAÇÃO UTE MAUÉS
</div>



<div class="topo">

<div class="logo">

Oliveira Energia

<small>Desde 1972</small>

</div>


<h1>
GRUPO GERADORES<br>
UTE MAUÉS
</h1>


</div>



<div class="grid-superior" id="superior"></div>



<div class="centro">

<h2>60 GRUPOS GERADORES</h2>

<p>360 = 1 GG</p>
<p>550 = 50 GG</p>
<p>625 = 3 GG</p>
<p>KTA = 6 KUMMIS</p>

</div>



<div class="inferior" id="inferior"></div>


</div>

</body>
</html>
