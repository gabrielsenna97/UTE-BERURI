<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grupo Geradores UTE Maués</title>

<style>

:root{
    --preto:#111111;
    --verde:#00843D;
    --amarelo:#FFD100;
    --cinza:#eeeeee;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:
    linear-gradient(135deg,#222,#555);

    padding:20px;

    overflow-x:auto;

}



.container{

    width:1200px;

    margin:auto;

    background:#fff;

    padding:30px;

    border:4px solid var(--preto);

    border-radius:15px;

    box-shadow:0 10px 30px #0008;

}



.faixa{

    background:
    linear-gradient(
    90deg,
    var(--preto),
    var(--verde),
    var(--amarelo)
    );

    color:white;

    text-align:center;

    padding:8px;

    font-weight:bold;

    border-radius:5px;

    margin-bottom:20px;

}



.topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:5px solid var(--amarelo);

    padding-bottom:20px;

    margin-bottom:25px;

}



.logo{

    font-size:32px;

    font-weight:900;

    color:var(--verde);

}



.logo small{

    display:block;

    font-size:13px;

    color:#333;

}



h1{

    flex:1;

    text-align:center;

    color:var(--preto);

}



.grid-superior{

    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:15px;

}



.inferior{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:40px;

}



.coluna,
.coluna-inferior{

    display:flex;

    flex-direction:column;

    gap:12px;

}



.bloco{

    height:75px;

    border:3px solid var(--preto);

    border-radius:8px;

    background:
    linear-gradient(145deg,#fff,#e5e5e5);

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

}



.grande{

    height:180px;

}



.codigo{

    font-size:13px;

    font-weight:bold;

}



.numero{

    font-size:38px;

    font-weight:900;

    color:var(--verde);

}



.centro{

    width:450px;

    margin:30px auto;

    padding:25px;

    text-align:center;

    border:4px solid var(--verde);

    border-radius:12px;

    background:#fffbea;

}


.centro h2{

    color:var(--verde);

}


.centro p{

    font-weight:bold;

    margin:8px;

}



@media(max-width:600px){

    .container{

        transform:scale(.75);

        transform-origin:top left;

        margin-bottom:-250px;

    }

}

</style>

</head>

<body>


<div class="container">


<div class="faixa">
OLIVEIRA ENERGIA - UTE MAUÉS
</div>


<div class="topo">

<div class="logo">
Oliveira Energia
<small>Desde 1972</small>
</div>


<h1>
GRUPO GERADORES<br>
UTE MAUÉS
</h1>

</div>


<div id="superior" class="grid-superior"></div>


<div class="centro">

<h2>60 GRUPOS GERADORES</h2>

<p>360 = 1 GG</p>
<p>550 = 50 GG</p>
<p>625 = 3 GG</p>
<p>KTA = 6 KUMMIS</p>

</div>


<div id="inferior" class="inferior"></div>


</div>


<script>

function bloco(c,n,g=false){

return `
<div class="bloco ${g?'grande':''}">
<div class="codigo">${c}</div>
<div class="numero">${n}</div>
</div>`;
}


const superior=[

[
["550-0583","54"],

],

superior.forEach(col=>{

let h="<div class='coluna'>";

col.forEach(g=>{

h+="</div>";

document.querySelector("#superior").innerHTML+=h;

</script>


</body>
</html>
