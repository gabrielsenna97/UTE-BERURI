<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão de Ocorrências - UTE Maués</title>

<style>

:root{
    --preto:#111;
    --verde:#00843D;
    --amarelo:#FFD100;
    --vermelho:#d00000;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:linear-gradient(135deg,#222,#555);
    padding:20px;
    overflow-x:auto;

}



.container{

    width:1200px;
    margin:auto;
    background:white;
    padding:30px;
    border:4px solid var(--preto);
    border-radius:15px;
    box-shadow:0 10px 30px #0008;

}



.faixa{

    background:linear-gradient(
        90deg,
        #111,
        #00843D,
        #FFD100
    );

    color:white;
    text-align:center;
    padding:10px;
    font-weight:bold;
    border-radius:5px;
    margin-bottom:20px;

}



.topo{

    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:5px solid var(--amarelo);
    padding-bottom:20px;
    margin-bottom:25px;

}



.logo{

    font-size:32px;
    font-weight:900;
    color:var(--verde);

}



.logo small{

    display:block;
    font-size:13px;
    color:#333;

}



h1{

    flex:1;
    text-align:center;
    color:#111;

}


/* MAPA */

.grid-superior{

    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:15px;

}



.inferior{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:40px;

}



.coluna,
.coluna-inferior{

    display:flex;
    flex-direction:column;
    gap:12px;

}



.bloco{

    height:75px;
     position:relative;

    border:3px solid #111;

    border-radius:8px;

    background:linear-gradient(
        145deg,
        #fff,
        #ddd
    );

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    cursor:pointer;

    transition:.2s;

}



.bloco:hover{

    transform:scale(1.05);
    background:#fff3b0;

}



.grande{

    height:180px;

}


.contador{

    position:absolute;

    top:3px;

    right:8px;

    font-size:18px;

    font-weight:900;

    color:#d00000;

}



.codigo{

    font-size:12px;
    font-weight:bold;

}



.numero{

    font-size:38px;
    font-weight:900;
    color:var(--verde);

}


/* CENTRO */


.centro{

    width:450px;
    margin:30px auto;
    padding:25px;

    text-align:center;

    border:4px solid var(--verde);

    border-radius:12px;

    background:#fffbea;

}


.centro h2{

    color:var(--verde);

}


.centro p{

    font-weight:bold;
    margin:8px;

}


/* MODAL */


.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#0008;

justify-content:center;

align-items:center;

z-index:999;

}



.modal-conteudo{

background:white;

width:450px;

max-height:90vh;

overflow:auto;

padding:25px;

border-radius:15px;

border:4px solid var(--verde);

}



.modal-conteudo h2{

text-align:center;

color:var(--verde);

margin-bottom:20px;

}



.botao{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:8px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}


.registrar{

background:#00843D;

color:white;

}


.historico{

background:#333;

color:white;

}


.fechar{

background:#d00000;

color:white;

}


input,
textarea{

width:100%;

padding:10px;

margin-top:8px;

border:2px solid #aaa;

border-radius:8px;

font-size:16px;

}


textarea{

height:120px;

}


/* BARRA DE CARREGAMENTO */

.loading-bar{

display:none;

width:100%;

height:10px;

background:#ddd;

border-radius:10px;

overflow:hidden;

margin-top:15px;

}


.loading-progress{

width:0%;

height:100%;

background:#00843D;

border-radius:10px;

transition:.3s;

}



.registrar:disabled{

opacity:.7;

cursor:not-allowed;

}


/* CELULAR */

@media(max-width:768px){
    /* CELULAR */

@media(max-width:768px){


body{

    padding:5px;
    overflow-x:hidden;

}



.container{

    width:100%;
    padding:10px;

}



/* deixa os grupos em uma coluna */

.grid-superior,
.inferior{

    display:flex;

    flex-direction:column;

    gap:12px;

}



/* cada coluna vira uma sequência */

.coluna,
.coluna-inferior{

    display:flex;

    flex-direction:column;

    gap:12px;

}



/* quadrados maiores */

.bloco{

    width:100%;

    height:110px;

}



/* número maior */

.numero{

    font-size:50px;

}



/* código da máquina */

.codigo{

    font-size:14px;

}



/* contador vermelho */

.contador{

    font-size:22px;

    top:5px;

    right:10px;

}



/* título */

.logo{

    font-size:24px;

}



h1{

    font-size:22px;

}



/* centro */

.centro{

    width:100%;

}



/* janela de registro */

.modal-conteudo{

    width:95%;

    padding:20px;

}



input,
textarea{

    font-size:18px;

    padding:15px;

}



.botao{

    font-size:18px;

    padding:16px;

}


}


}


.container{

width:1200px;

}


.modal{

padding:15px;

align-items:flex-start;

overflow-y:auto;

}


.modal-conteudo{

width:100%;

max-width:450px;

margin:20px auto;

padding:20px;

}


.botao{

padding:16px;

font-size:18px;

}


input,
textarea{

padding:16px;

font-size:16px;

}


textarea{

height:160px;

}


}
    .lista-celular{

display:none;

}



@media(max-width:768px){


.grid-superior,
.inferior,
.centro{

display:none;

}



.lista-celular{

display:flex;

flex-direction:column;

gap:10px;

}



.item-ugd{

background:white;

border:3px solid #111;

border-radius:10px;

padding:15px;

text-align:center;

font-size:24px;

font-weight:900;

color:#00843D;

}


}

</style>

</head> <body>


<div class="container">


<div class="faixa">

OLIVEIRA ENERGIA - UTE MAUÉS

</div>


<div class="topo">


<div class="logo">

Oliveira Energia

<small>Desde 1972</small>

</div>



<h1>

GRUPO GERADORES<br>
UTE MAUÉS

</h1>


</div>

<div id="listaCelular" class="lista-celular"></div>

<div id="superior" class="grid-superior"></div>




<div class="centro">

<h2>

60 GRUPOS GERADORES

</h2>


<p>360 = 1 GG</p>

<p>550 = 50 GG</p>

<p>625 = 3 GG</p>

<p>KTA = 6 KUMMIS</p>


</div>




<div id="inferior" class="inferior"></div>


</div>





<div class="modal" id="modal">


<div class="modal-conteudo" id="modalConteudo">


</div>


</div>






<script>



// =====================================
// CRIAÇÃO DOS BLOCOS
// =====================================


function bloco(codigo,numero,grande=false){


return `


<div class="bloco ${grande ? "grande":""}"

onclick="abrirUGD('${numero}')">


<div class="contador" id="cont-${numero}"></div>


<div class="codigo">

${codigo}

</div>


<div class="numero">

${numero}

</div>


</div>


`;

}





// =====================================
// MAPA SUPERIOR
// =====================================


const superior=[


[

["550-0583","54"],

["550-0715","53"],

["550-0038R","52"],

["625-0017","51"],

["550-0321R","46"],

["550-0517","41"]

],



[

["1808201","55",1],

["550-0297R","50"],

["550-0104R","45"],

["625-0038","40"]

],



[

["1808203","56",1],

["625-0019","49"],

["550-0609R","44"],

["550-0025R","39"]

],



[

["1808198","57",1],

["550-0515","48"],

["550-0518","43"],

["550-0582","38"]

],



[

["1808199","58",1],

["550-0602","47"],

["550-0515","42"],

["550-0251R","37"]

],



[

["1808205","59",1],

["1808200","60",1]

]


];




superior.forEach(coluna=>{


let html="<div class='coluna'>";


coluna.forEach(item=>{


html+=bloco(

item[0],

item[1],

item[2]

);


});


html+="</div>";



document

.getElementById("superior")

.innerHTML+=html;



});







// =====================================
// MAPA INFERIOR
// =====================================


const inferior=[



[

["550-0589","04"],

["550-0590","08"],

["550-0598","12"],

["550-0471","16"],

["550-0599","20"],

["550-0600","24"],

["550-0594","28"],

["550-0344R","32"],

["550-0596","36"]

],




[

["550-0562","03"],

["550-0142","07"],

["550-0591","11"],

["550-0476","15"],

["550-0592","19"],

["550-0581","23"],

["550-0366","27"],

["550-0367","31"],

["550-0563","35"]

],




[

["550-0028R","02"],

["550-0597","06"],

["550-0176","10"],

["550-0027R","14"],

["550-0305","18"],

["550-05125R","22"],

["360-0015","26"],

["550-0302R","30"],

["550-0209R","34"]

],




[

["550-0024R","01"],

["550-0184","05"],

["550-0565","09"],

["550-0566","13"],

["550-0601","17"],

["550-0593","21"],

["550-0302R1","25"],

["550-0241R","29"],

["550-0482","33"]

]


];





inferior.forEach(coluna=>{


let html="<div class='coluna-inferior'>";



coluna.forEach(item=>{


html+=bloco(

item[0],

item[1]

);


});


html+="</div>";



document

.getElementById("inferior")

.innerHTML+=html;



});





// =====================================
// VARIÁVEIS
// =====================================


let ugdSelecionada="";
    for(let i=1;i<=60;i++){


let numero=i.toString().padStart(2,"0");


document.getElementById("listaCelular").innerHTML += `


<div class="item-ugd" onclick="abrirUGD('${numero}')">

UGD-${numero}

</div>


`;


}




// =====================================
// API GOOGLE SCRIPT
// =====================================


const API =

"https://script.google.com/macros/s/AKfycbxS3H4OIXRNieWyHZUP5s9yyXIDp9vpVQerZURePcGPBwaZBREUF9V1R1O2YzcxfoZS/exec";


// =====================================
// CONTADOR DE OCORRÊNCIAS
// =====================================

function carregarContadores(){


fetch(API)


.then(res=>res.json())


.then(lista=>{


let contagem={};



lista.forEach(item=>{


let numero=item.ugd.replace("UGD-","");



if(!contagem[numero]){

contagem[numero]=0;

}



contagem[numero]++;


});



Object.keys(contagem).forEach(ugd=>{


let campo=document.getElementById("cont-"+ugd);



if(campo){

campo.innerHTML=contagem[ugd];

}


});


})


.catch(erro=>{


console.log("Erro contador:",erro);


});


}



carregarContadores();






// =====================================
// ABRIR UGD
// =====================================


function abrirUGD(numero){


ugdSelecionada=numero;


document.getElementById("modal").style.display="flex";



document.getElementById("modalConteudo").innerHTML=`


<h2>

UGD-${numero}

</h2>



<button class="botao registrar"

onclick="registrarOcorrencia()">

📝 Registrar Ocorrência

</button>



<button class="botao historico"

onclick="verHistorico()">

📋 Ver Histórico

</button>




<button class="botao fechar"

onclick="fecharModal()">

Fechar

</button>


`;


}







// =====================================
// FORMULÁRIO DE REGISTRO
// =====================================


function registrarOcorrencia(){


let hoje=new Date().toLocaleDateString("pt-BR");



document.getElementById("modalConteudo").innerHTML=`



<h2>

Registrar Ocorrência

<br>

UGD-${ugdSelecionada}

</h2>




<label>

Data

</label>


<input id="data" value="${hoje}">



<label>

Colaborador

</label>


<input id="colaborador"

placeholder="Nome do colaborador">



<label>

Descrição

</label>


<textarea id="descricao"

placeholder="Descrição da ocorrência"></textarea>





<button id="btnSalvar"

class="botao registrar"

onclick="salvarOcorrencia()">


💾 Salvar


</button>




<div class="loading-bar" id="barraLoading">


<div class="loading-progress"

id="progressoLoading">


</div>


</div>





<button class="botao fechar"

onclick="fecharModal()">


Cancelar


</button>



`;


}







// =====================================
// SALVAR OCORRÊNCIA COM BARRA
// =====================================


function salvarOcorrencia(){



let botao=document.getElementById("btnSalvar");

let barra=document.getElementById("barraLoading");

let progresso=document.getElementById("progressoLoading");



botao.disabled=true;


botao.innerHTML="⏳ Salvando...";


barra.style.display="block";



let valor=0;



let animacao=setInterval(()=>{


if(valor < 90){


valor+=10;


progresso.style.width=valor+"%";


}


},300);






let dados={


ugd:"UGD-"+ugdSelecionada,


data:document.getElementById("data").value,


colaborador:document.getElementById("colaborador").value,


descricao:document.getElementById("descricao").value


};




fetch(API,{


method:"POST",


body:JSON.stringify(dados)


})



.then(()=>{


clearInterval(animacao);



progresso.style.width="100%";



botao.innerHTML="✅ Salvo!";


botao.style.background="#006400";



setTimeout(()=>{


alert("Ocorrência registrada com sucesso!");


location.reload();



},1000);



})



.catch(()=>{


clearInterval(animacao);



botao.disabled=false;


botao.innerHTML="💾 Salvar";


barra.style.display="none";



alert("Erro ao salvar ocorrência");


});



}







// =====================================
// HISTÓRICO
// =====================================


function verHistorico(){



document.getElementById("modalConteudo").innerHTML=`


<h2>

Histórico UGD-${ugdSelecionada}

</h2>


<p>

Carregando...

</p>


`;





fetch(API+"?ugd=UGD-"+ugdSelecionada)



.then(res=>res.json())



.then(lista=>{



let tela=`



<h2>

Histórico UGD-${ugdSelecionada}

</h2>



`;





lista.reverse().forEach(item=>{



tela+=`



<div style="

border:2px solid #ccc;

border-radius:8px;

padding:12px;

margin-top:10px;

">



<b>ID:</b> ${item.id}

<br>



<b>Data:</b> ${new Date(item.data).toLocaleDateString("pt-BR")}

<br>



<b>Colaborador:</b> ${item.colaborador}



<br><br>



<b>Descrição:</b>



<p>

${item.descricao}

</p>



</div>



`;



});




tela+=`



<button class="botao fechar"

onclick="fecharModal()">


Fechar


</button>



`;





document.getElementById("modalConteudo").innerHTML=tela;



});



}








// =====================================
// FECHAR MODAL
// =====================================


function fecharModal(){


document.getElementById("modal").style.display="none";


}






window.onclick=function(event){



let modal=document.getElementById("modal");



if(event.target===modal){


fecharModal();


}



}




</script>


</body>


</html>
