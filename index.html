<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão de Ocorrências - UTE Maués</title>

<style>

:root{
    --preto:#111;
    --verde:#00843D;
    --amarelo:#FFD100;
    --vermelho:#d00000;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    background:linear-gradient(135deg,#222,#555);

    padding:20px;

}


.container{

    width:1200px;

    margin:auto;

    background:white;

    padding:30px;

    border:4px solid var(--preto);

    border-radius:15px;

    box-shadow:0 10px 30px #0008;

}



.faixa{

    background:
    linear-gradient(
    90deg,
    #111,
    #00843D,
    #FFD100
    );

    color:white;

    text-align:center;

    padding:10px;

    font-weight:bold;

    border-radius:5px;

}



.topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:20px 0;

    border-bottom:5px solid var(--amarelo);

    margin-bottom:25px;

}



.logo{

    font-size:30px;

    font-weight:900;

    color:var(--verde);

}


.logo small{

    display:block;

    font-size:13px;

    color:#333;

}



h1{

    text-align:center;

    flex:1;

}



.grid-superior{

    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:15px;

}



.inferior{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:40px;

}



.coluna,
.coluna-inferior{

    display:flex;

    flex-direction:column;

    gap:12px;

}



.bloco{

    height:75px;

    border:3px solid #111;

    border-radius:8px;

    background:
    linear-gradient(145deg,#fff,#ddd);

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    cursor:pointer;

    transition:.2s;

}



.bloco:hover{

    transform:scale(1.05);

    background:#fff4b8;

}



.grande{

    height:180px;

}



.codigo{

    font-size:12px;

    font-weight:bold;

}


.numero{

    font-size:38px;

    font-weight:900;

    color:var(--verde);

}



.centro{

    width:450px;

    margin:30px auto;

    padding:25px;

    text-align:center;

    border:4px solid var(--verde);

    border-radius:12px;

    background:#fffbea;

}



.centro h2{

    color:var(--verde);

}


/* MODAL */

.modal{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:#0008;

    justify-content:center;

    align-items:center;

    z-index:999;

}



.caixa-modal{

    width:450px;

    background:white;

    padding:25px;

    border-radius:15px;

    border:4px solid var(--verde);

}



.caixa-modal h2{

    text-align:center;

    color:var(--verde);

    margin-bottom:20px;

}



.botao{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:none;

    border-radius:8px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}



.registrar{

    background:var(--verde);

    color:white;

}



.historico{

    background:#333;

    color:white;

}


input, textarea{

    width:100%;

    padding:10px;

    margin-top:8px;

    border:2px solid #aaa;

    border-radius:8px;

}


textarea{

    height:120px;

}



.fechar{

    background:#d00000;

    color:white;

}



</style>

</head>


<body>


<div class="container">


<div class="faixa">
OLIVEIRA ENERGIA - UTE MAUÉS
</div>


<div class="topo">


<div class="logo">
Oliveira Energia
<small>Desde 1972</small>
</div>


<h1>
GESTÃO DE OCORRÊNCIAS<br>
GRUPOS GERADORES
</h1>


</div>


<div id="superior" class="grid-superior"></div>


<div class="centro">

<h2>60 GRUPOS GERADORES</h2>

<p>Registro e histórico de ocorrências</p>

</div>


<div id="inferior" class="inferior"></div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">


<div class="caixa-modal" id="conteudoModal">


</div>


</div> <script>

// ===============================
// MAPA DOS GRUPOS GERADORES
// ===============================


function bloco(c,n,g=false){

return `
<div class="bloco ${g?'grande':''}" onclick="abrirUGD('${n}')">

<div class="codigo">${c}</div>

<div class="numero">${n}</div>

</div>
`;

}



// GRUPOS SUPERIORES

const superior=[

[
["550-0583","54"],
["550-0715","53"],
["550-0038R","52"],
["625-0017","51"],
["550-0321R","46"],
["550-0517","41"]
],

[
["1808201","55",1],
["550-0297R","50"],
["550-0104R","45"],
["625-0038","40"]
],

[
["1808203","56",1],
["625-0019","49"],
["550-0609R","44"],
["550-0025R","39"]
],

[
["1808198","57",1],
["550-0515","48"],
["550-0518","43"],
["550-0582","38"]
],

[
["1808199","58",1],
["550-0602","47"],
["550-0515","42"],
["550-0251R","37"]
],

[
["1808205","59",1],
["1808200","60",1]
]

];



superior.forEach(col=>{

let h="<div class='coluna'>";

col.forEach(g=>{

h+=bloco(g[0],g[1],g[2]);

});

h+="</div>";

document.querySelector("#superior").innerHTML+=h;

});





// GRUPOS INFERIORES


const inferior=[

[
["550-0589","04"],
["550-0590","08"],
["550-0598","12"],
["550-0471","16"],
["550-0599","20"],
["550-0600","24"],
["550-0594","28"],
["550-0344R","32"],
["550-0596","36"]
],


[
["550-0562","03"],
["550-0142","07"],
["550-0591","11"],
["550-0476","15"],
["550-0592","19"],
["550-0581","23"],
["550-0366","27"],
["550-0367","31"],
["550-0563","35"]
],


[
["550-0028R","02"],
["550-0597","06"],
["550-0176","10"],
["550-0027R","14"],
["550-0305","18"],
["550-05125R","22"],
["360-0015","26"],
["550-0302R","30"],
["550-0209R","34"]
],


[
["550-0024R","01"],
["550-0184","05"],
["550-0565","09"],
["550-0566","13"],
["550-0601","17"],
["550-0593","21"],
["550-0302R1","25"],
["550-0241R","29"],
["550-0482","33"]
]

];



inferior.forEach(col=>{


let h="<div class='coluna-inferior'>";


col.forEach(g=>{


h+=bloco(g[0],g[1]);


});


h+="</div>";


document.querySelector("#inferior").innerHTML+=h;


});





// ===============================
// ABRIR MENU DA UGD
// ===============================


let ugdSelecionada="";



function abrirUGD(numero){


ugdSelecionada=numero;



document.getElementById("modal").style.display="flex";



document.getElementById("conteudoModal").innerHTML=`

<h2>
UGD-${numero}
</h2>


<button class="botao registrar"
onclick="registrarOcorrencia()">

📝 Registrar Ocorrência

</button>



<button class="botao historico"
onclick="verHistorico()">

📋 Ver Histórico

</button>



<button class="botao fechar"
onclick="fecharModal()">

Fechar

</button>

`;

}



function fecharModal(){

document.getElementById("modal").style.display="none";

}



function registrarOcorrencia(){


let data=new Date()
.toLocaleDateString("pt-BR");



document.getElementById("conteudoModal").innerHTML=`

<h2>
Nova Ocorrência<br>
UGD-${ugdSelecionada}
</h2>


<label>
Data
</label>


<input id="data"
value="${data}">



<label>
Colaborador
</label>


<input id="nome"
placeholder="Digite seu nome">



<label>
Descrição da ocorrência
</label>


<textarea id="descricao"
placeholder="Digite a ocorrência encontrada">
</textarea>



<button class="botao registrar"
onclick="salvarOcorrencia()">

Salvar Ocorrência

</button>



<button class="botao fechar"
onclick="fecharModal()">

Cancelar

</button>


`;

}

<script>

// ===============================
// BANCO LOCAL DE OCORRÊNCIAS
// ===============================


let ocorrencias = JSON.parse(
localStorage.getItem("ocorrencias_ugd")
) || [];





// ===============================
// SALVAR OCORRÊNCIA
// ===============================


function salvarOcorrencia(){


let data=document.getElementById("data").value;

let nome=document.getElementById("nome").value;

let descricao=document.getElementById("descricao").value;



if(nome=="" || descricao==""){

alert("Preencha o nome e a descrição da ocorrência");

return;

}




let registro={

ugd:ugdSelecionada,

data:data,

nome:nome,

descricao:descricao

};



ocorrencias.push(registro);



localStorage.setItem(

"ocorrencias_ugd",

JSON.stringify(ocorrencias)

);




alert("Ocorrência registrada com sucesso!");



fecharModal();



}





// ===============================
// MOSTRAR HISTÓRICO
// ===============================


function verHistorico(){


let lista=ocorrencias.filter(

item=>item.ugd==ugdSelecionada

);



let html=`


<h2>

Histórico UGD-${ugdSelecionada}

</h2>

`;





if(lista.length==0){


html+=`

<p>
Nenhuma ocorrência registrada.
</p>

`;



}

else{


lista.reverse().forEach(item=>{


html+=`

<div style="
border:2px solid #ccc;
padding:10px;
margin:10px 0;
border-radius:8px;
">


<b>Data:</b> ${item.data}

<br>


<b>Colaborador:</b> ${item.nome}

<br><br>


<b>Descrição:</b>

<br>

${item.descricao}


</div>


`;



});


}





html+=`

<button class="botao fechar"
onclick="fecharModal()">

Fechar

</button>

`;




document.getElementById("conteudoModal").innerHTML=html;



}





// ===============================
// FECHAR CLICANDO FORA
// ===============================


window.onclick=function(event){


let modal=document.getElementById("modal");


if(event.target==modal){


modal.style.display="none";


}


}



</script>


</body>

</html>
