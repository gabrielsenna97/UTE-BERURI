<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTE Maués | Grupo Geradores</title>

<style>

:root{
    --azul:#003b70;
    --azul-claro:#0066aa;
    --cinza:#f1f3f5;
    --preto:#222;
    --borda:#1c1c1c;
    --branco:#fff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{
    background:#dfe6ec;
    padding:30px;
}


.container{

    max-width:1300px;
    margin:auto;

    background:white;
    padding:35px;

    border-radius:12px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.15);
}



/* CABEÇALHO */

.header{

display:flex;
align-items:center;
justify-content:space-between;

border-bottom:3px solid var(--azul);

padding-bottom:20px;
margin-bottom:30px;

}


.logo{

font-size:28px;
font-weight:800;
color:var(--azul);

}


.logo span{

display:block;
font-size:13px;
font-weight:400;

}



h1{

text-align:center;
font-size:30px;
color:#222;

}



/* GERADORES */

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));

gap:15px;

}



.gerador{

height:95px;

border:2px solid var(--borda);

border-radius:8px;

background:
linear-gradient(
135deg,
#fff,
#eef4f8
);


display:flex;

flex-direction:column;

align-items:center;

justify-content:center;


transition:.2s;

}



.gerador:hover{

transform:translateY(-4px);

box-shadow:
0 8px 15px rgba(0,0,0,.15);

}



.codigo{

font-size:13px;

color:#555;

}



.numero{

font-size:38px;

font-weight:800;

color:var(--azul);

}



/* RESUMO */

.resumo{

margin:35px auto;

max-width:450px;

border:2px solid var(--azul);

border-radius:10px;

padding:25px;

text-align:center;

background:#f8fbff;

}


.resumo h2{

color:var(--azul);

margin-bottom:15px;

}


.resumo p{

margin:8px;

font-size:18px;

}



/* MOBILE */


@media(max-width:600px){

body{
padding:10px;
}


.container{
padding:20px;
}


.header{

flex-direction:column;
gap:15px;

}


h1{

font-size:22px;

}

}


</style>

</head>


<body>


<div class="container">


<header class="header">

<div class="logo">

Oliveira Energia

<span>Desde 1972</span>

</div>


<h1>
GRUPO GERADORES<br>
UTE MAUÉS
</h1>


</header>



<section id="geradores" class="grid"></section>



<div class="resumo">

<h2>
60 GRUPOS GERADORES
</h2>

<p>360 = 1 GG</p>
<p>550 = 50 GG</p>
<p>625 = 3 GG</p>
<p>KTA = 6 KUMMIS</p>

</div>



</div>



<script>


const geradores=[


["550-0583","54"],
["550-0715","53"],
["550-0038R","52"],
["625-0017","51"],
["550-0321R","46"],

["1808201","55"],
["1808203","56"],
["1808198","57"],
["1808199","58"],
["1808205","59"],
["1808200","60"],


["550-0589","04"],
["550-0590","08"],
["550-0598","12"],
["550-0471","16"],
["550-0599","20"],

["550-0562","03"],
["550-0142","07"],
["550-0591","11"],
["550-0476","15"],


["550-0028R","02"],
["550-0597","06"],
["550-0176","10"],


["550-0024R","01"],
["550-0184","05"],
["550-0565","09"]


];



const painel=document.querySelector("#geradores");


geradores.forEach(g=>{


painel.innerHTML += `

<div class="gerador">

<div class="codigo">
${g[0]}
</div>

<div class="numero">
${g[1]}
</div>

</div>

`;


});


</script>


</body>

</html>
