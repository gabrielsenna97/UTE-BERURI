<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTE Maués - Gestão de Ocorrências</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

    <h1>UTE MAUÉS</h1>

    <h2>Gestão de Ocorrências dos Grupos Geradores</h2>

</header>

<div class="topo">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar UGD..."
onkeyup="pesquisarUGD()">

</div>

<div class="container">

<div id="mapa" class="mapa">

<!-- UGD serão criadas pelo JavaScript -->

</div>

</div>

<!-- Modal -->

<div id="modal" class="modal">

<div class="modal-content">

<span class="fechar" onclick="fecharModal()">&times;</span>

<h2 id="tituloUGD">UGD</h2>

<label>Data</label>

<input
type="date"
id="data">

<label>Colaborador</label>

<input
type="text"
id="colaborador"
placeholder="Nome do colaborador">

<label>Ocorrência</label>

<textarea
id="ocorrencia"
rows="6"
placeholder="Descreva a ocorrência..."></textarea>

<div class="botoes">

<button
class="salvar"
onclick="salvarRegistro()">

Salvar Registro

</button>

</div>

<hr>

<h3>Histórico</h3>

<div id="historico">

Nenhum registro.

</div>

</div>

</div>

<footer>

UTE Maués © 2026

</footer>

<script src="app.js"></script>

</body>
</html>
